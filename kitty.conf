# Originally generated by Home Manager.
# This file has been adjusted to work without home-manager

font_family Iosevka Nerd Font
font_size 11.500000

background_opacity 0.800000
background_blur 10
clear_all_shortcuts yes
enabled_layouts splits:split_axis=auto
font_features IosevkaNF cv10=3 cv36=1 VSAB=3 VLAA=2
kitty_mod ctrl+shift
remember_window_size yes
shell nu
tab_activity_symbol  ● 
wayland_titlebar_color background
tab_bar_align left
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]
active_tab_title_template {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]

map kitty_mod+, scroll_to_prompt -1
map kitty_mod+. scroll_to_prompt 1
map kitty_mod+[ previous_tab
map kitty_mod+] next_tab
map kitty_mod+alt+[ move_tab_backward
map kitty_mod+alt+] move_tab_forward
map kitty_mod+alt+down move_window bottom
map kitty_mod+alt+h move_window left
map kitty_mod+alt+j move_window bottom
map kitty_mod+alt+k move_window top
map kitty_mod+alt+l move_window right
map kitty_mod+alt+left move_window left
map kitty_mod+alt+right move_window right
map kitty_mod+alt+t set_tab_title
map kitty_mod+alt+up move_window top
map kitty_mod+backspace change_font_size all 0
map kitty_mod+c copy_to_clipboard
map kitty_mod+d detach_window ask
map kitty_mod+down neighboring_window bottom
map kitty_mod+end scroll_end
map kitty_mod+enter launch --location=split --cwd=current
map kitty_mod+equal change_font_size all +2.0
map kitty_mod+h neighboring_window left
map kitty_mod+home scroll_home
map kitty_mod+j neighboring_window bottom
map kitty_mod+k neighboring_window top
map kitty_mod+l neighboring_window right
map kitty_mod+left neighboring_window left
map kitty_mod+minus change_font_size all -2.0
map kitty_mod+page_down scroll_page_down
map kitty_mod+page_up scroll_page_up
map kitty_mod+plus change_font_size all +2.0
map kitty_mod+r start_resizing_window
map kitty_mod+right neighboring_window right
map kitty_mod+t launch --type=tab --cwd=current
map kitty_mod+tab next_tab
map kitty_mod+u layout_action rotate
map kitty_mod+up neighboring_window top
map kitty_mod+v paste_from_clipboard
map kitty_mod+w close_window

## THEME

background #0c0c0c
foreground #dddad2
selection_background #747369
selection_foreground #dddad2
url_color #a09f93
cursor #dddad2
cursor_text_color #0c0c0c
active_border_color #747369
inactive_border_color #0c0c0c
active_tab_background #0c0c0c
active_tab_foreground #dddad2
inactive_tab_background #0c0c0c
inactive_tab_foreground #a09f93
tab_bar_background #0c0c0c
wayland_titlebar_color #0c0c0c
macos_titlebar_color #0c0c0c

